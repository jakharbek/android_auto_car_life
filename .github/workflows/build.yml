name: Build APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Head unit certificate
        id: cert
        env:
          HU_CERT_PEM: ${{ secrets.HU_CERT_PEM }}
          HU_KEY_PEM: ${{ secrets.HU_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -n "$HU_CERT_PEM" ] && [ -n "$HU_KEY_PEM" ]; then
            mkdir -p app/src/main/assets/hu
            printf '%s\n%s\n' "$HU_CERT_PEM" "$HU_KEY_PEM" > app/src/main/assets/hu/hu.pem
            # the pair must be readable and belong together, otherwise Android Auto would refuse the APK
            CERT_MOD=$(openssl x509 -in app/src/main/assets/hu/hu.pem -noout -modulus) || { echo "::error::HU_CERT_PEM is not a readable PEM certificate"; exit 1; }
            KEY_MOD=$(awk '/-----BEGIN .*PRIVATE KEY-----/,/-----END .*PRIVATE KEY-----/' app/src/main/assets/hu/hu.pem | openssl rsa -noout -modulus 2>/dev/null) || { echo "::error::HU_KEY_PEM is not a readable PEM private key"; exit 1; }
            [ "$CERT_MOD" = "$KEY_MOD" ] || { echo "::error::HU_KEY_PEM does not belong to HU_CERT_PEM"; exit 1; }
            openssl x509 -in app/src/main/assets/hu/hu.pem -noout -checkend 2592000 || echo "::warning::the head unit certificate expires within 30 days"
            echo "Certificate checked and added to the APK"
            echo "embedded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HU_CERT_PEM / HU_KEY_PEM secrets are not set: this APK has no certificate and will not be released"
            echo "embedded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.MONZA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MONZA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MONZA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/signing"
          mkdir -p "$D"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$D/release.jks"
            ALIAS="${KEY_ALIAS:-monzaauto}"
            PW="$KEYSTORE_PASSWORD"
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          else
            ALIAS=monzaauto
            PW="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$D/release.jks" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Monza Auto" >/dev/null
            echo "::warning::MONZA_KEYSTORE_BASE64 is not set: signed with a one-time key, updates will need a reinstall"
            echo "permanent=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$PW"
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PW" "$ALIAS" "$PW" > "$D/release.properties"
          echo "MONZA_SIGNING_PROPERTIES=$D/release.properties" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VER=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          OUT="monza-auto-$VER.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          if [ "${{ steps.cert.outputs.embedded }}" = "true" ]; then
            unzip -l "$OUT" | grep -q "assets/hu/hu.pem" || { echo "::error::certificate missing from the APK"; exit 1; }
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          # a release is made once per version: the published APK always matches its tag
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$VER already exists: raise versionName to publish a new one (APK is in the artifacts)"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Release
        if: >-
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch')
          && steps.apk.outputs.new == 'true' && steps.signing.outputs.permanent == 'true'
          && steps.cert.outputs.embedded == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Monza Auto ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.file }}
          make_latest: 'true'
          body: Monza Auto ${{ steps.apk.outputs.version }}
